# Modified for Maxit, 2026-10-21: Weft documentation logo and favicon.
site_name: Maxit Documentation
site_description: Documentation for the Maxit FOSS AI assistant

theme:
  name: material
  logo: assets/weft-white.svg
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.tabs.link

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features:
    - Chat & Conversations: features/chat.md
    - Multi-Service: features/multi-service.md
    - Tools: features/tools.md
    - MCP Servers: features/mcp.md
    - Dynamic UI: features/dynamic-ui.md
    - Memories: features/memories.md
    - Heartbeat: features/heartbeat.md
    - Tasks: features/tasks.md
    - Daemon: features/daemon.md
    - Encryption: features/encryption.md
    - On-Device Inference: features/on-device-inference.md
    - Reasoning: features/reasoning.md
    - System Prompts: features/system-prompts.md
    - Skills: features/skills.md
    - Linux Sandbox: features/sandbox.md
    - Maxit Build: features/maxit-build.md
    - Notifications: features/notifications.md
    - SMS: features/sms.md
    - Appearance: features/appearance.md
    - Settings Export & Import: features/settings-export-import.md
  - Desktop Release Smoke Test: desktop-release-smoketest.md
