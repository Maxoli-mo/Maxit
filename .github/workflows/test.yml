# Modified for Maxit, 2026-10-20.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting and run Linux desktop tests
        run: ./gradlew spotlessCheck :composeApp:desktopTest --no-daemon --stacktrace
      - name: Build FOSS Android and Web
        run: ./gradlew :androidApp:assembleFossDebug :composeApp:wasmJsBrowserDistribution --no-daemon --stacktrace
